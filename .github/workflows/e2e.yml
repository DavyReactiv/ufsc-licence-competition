name: WordPress E2E and Visual QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Node QA dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start disposable WordPress environment
        run: npx wp-env start
      - name: Wait for WordPress
        run: curl --retry 20 --retry-delay 3 --retry-connrefused --fail http://localhost:8888/wp-login.php --output /dev/null
      - name: Run Playwright workflow and visual checks
        run: npm run test:e2e
        env:
          WP_BASE_URL: http://localhost:8888
          WP_ADMIN_USER: admin
          WP_ADMIN_PASSWORD: password
      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ufsc-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop WordPress environment
        if: always()
        run: npx wp-env stop || true
