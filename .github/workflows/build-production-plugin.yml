name: Build production plugin

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "composer.json"
      - "composer.lock"
      - "ufsc-licence-competition.php"
      - "includes/**"
      - "templates/**"
      - ".github/workflows/build-production-plugin.yml"
  push:
    branches:
      - main
    paths:
      - "composer.json"
      - "composer.lock"
      - "ufsc-licence-competition.php"
      - "includes/**"
      - "templates/**"
      - ".github/workflows/build-production-plugin.yml"

permissions:
  contents: read

jobs:
  build:
    name: Production ZIP with Composer dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --no-check-publish

      - name: Build verified self-contained plugin
        id: package
        shell: bash
        run: |
          bash tools/build-production-package.sh | tee /tmp/ufsc-package.env
          grep '^PACKAGE_PATH=' /tmp/ufsc-package.env >> "$GITHUB_OUTPUT"
          grep '^PACKAGE_NAME=' /tmp/ufsc-package.env >> "$GITHUB_OUTPUT"

      - name: Verify installable archive
        shell: bash
        run: |
          test -f "${{ steps.package.outputs.PACKAGE_PATH }}"
          unzip -l "${{ steps.package.outputs.PACKAGE_PATH }}" | grep 'ufsc-licence-competition/vendor/autoload.php'
          unzip -l "${{ steps.package.outputs.PACKAGE_PATH }}" | grep 'ufsc-licence-competition/vendor/dompdf/dompdf/src/Dompdf.php'
          unzip -l "${{ steps.package.outputs.PACKAGE_PATH }}" | grep 'ufsc-licence-competition/DISTRIBUTION-VERSION'

      - name: Upload production ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ufsc-licence-competition-self-contained
          path: ${{ steps.package.outputs.PACKAGE_PATH }}
          if-no-files-found: error
          retention-days: 14
